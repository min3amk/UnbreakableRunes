plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = mod_version
group = mod_group_id

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { unbreakablerunes { sourceSet sourceSets.main } }
}

repositories {
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    // Ars Nouveau 5.11.3 for Minecraft 1.21.1. The current proof-of-concept
    // uses vanilla/NeoForge entity events and does not compile against Ars API.
    compileOnly 'com.hollingsworth.ars_nouveau:ars_nouveau-1.21.1:5.11.3'
}

 tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
