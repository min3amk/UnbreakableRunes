plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

group = 'com.amine.unbreakablerunes'
version = '0.2.0'

base {
    archivesName = 'unbreakablerunes'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
}

neoForge {
    version = '21.1.248'
}

dependencies {
    // Only needed to compile against Ars Nouveau's API. transitive=false avoids
    // trying to download GeckoLib/Curios/Patchouli just to build.
    compileOnly("com.hollingsworth.ars_nouveau:ars_nouveau-1.21.1:5.11.3") {
        transitive = false
    }
}
