
name: Build Unbreakable Runes

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build mod
        run: gradle build
        working-directory: ./UnbreakableRunes

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: UnbreakableRunes
          path: UnbreakableRunes/build/libs/*.jar
